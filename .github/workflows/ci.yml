name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install core + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile check
        run: python -m compileall engine main.py

      - name: Run test suite (no browser, no network)
        run: python -m pytest tests -q

      - name: CLI smoke test
        run: glider validate configs/hacker_news.json

      - name: Package build check
        run: python -m pip wheel . --no-deps -w dist

  browser-tests:
    name: Browser tests (Python 3.11 / ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with browser support
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,browser]"
          playwright install --with-deps chromium
      - name: Run browser-marked tests
        run: python -m pytest tests -m browser -q
