[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glider"
version = "3.0.1"
description = "High-performance, configuration-driven web scraping framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "axewhyzed" }]
keywords = ["scraping", "asyncio", "playwright", "curl-cffi"]
dependencies = [
    "aiofiles>=25.0",
    "aiolimiter>=1.2",
    "aiosqlite>=0.20",
    "curl_cffi>=0.14",
    "cssselect>=1.2",
    "fake-useragent>=2.0",
    "jsonpath-ng>=1.6",
    "loguru>=0.7",
    "lxml>=5.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "tenacity>=9.0",
    "typer>=0.12",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40",
    "playwright-stealth>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
glider = "main:run"

[tool.setuptools]
packages = ["engine"]
py-modules = ["main"]
